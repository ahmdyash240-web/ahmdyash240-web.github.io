<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>حملة الصفر - Special Forces Group 2 Replica</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050b14;
            color: #fff;
        }

        /* القائمة الرئيسية */
        #main-menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0b1329 0%, #1d2b45 100%);
            z-index: 10;
        }

        .menu-title {
            font-size: 2.8rem;
            color: #ef4444;
            text-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
            margin-bottom: 20px;
        }

        .panel {
            background: rgba(15, 23, 42, 0.9);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #334155;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: right;
        }

        .form-group label {
            font-size: 0.95rem;
            color: #cbd5e1;
        }

        select, input[type="number"] {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #1e293b;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }

        .btn:hover { background: #dc2626; }
        .btn-secondary { background: #334155; }
        .btn-secondary:hover { background: #475569; }

        /* منطقة اللعبة */
        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: none;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* واجهة المحاكي للابتوب (Keys Overlay) */
        .emulator-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }

        .key-hint {
            position: absolute;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: #00ffcc;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            pointer-events: none;
        }

        /* أدوات التحكم للجوال */
        .touch-controls {
            display: none;
            position: absolute;
            bottom: 20px; left: 20px; right: 20px;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: auto;
        }

        .touch-btn {
            width: 65px; height: 65px;
            background: rgba(255,255,255,0.25);
            border: 2px solid #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            touch-action: manipulation;
        }

        /* نافذة ضبط المفاتيح */
        #settings-modal {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #475569;
            z-index: 20;
            width: 320px;
        }

        /* مؤشر التصويب (Crosshair) */
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 10px; height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: #00ffcc;
        }
        #crosshair::before { top: 4px; left: -10px; width: 30px; height: 2px; }
        #crosshair::after { top: -10px; left: 4px; width: 2px; height: 30px; }
    </style>
    <!-- مكتبة الجرافيكس ثلاثية الأبعاد Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- القائمة الرئيسية -->
    <div id="main-menu">
        <h1 class="menu-title">حملة الصفر</h1>
        <div class="panel">
            <div class="form-group">
                <label>عدد البوتات (Bots):</label>
                <input type="number" id="botCount" value="6" min="1" max="16">
            </div>

            <div class="form-group">
                <label>مستوى الصعوبة:</label>
                <select id="difficulty">
                    <option value="easy">سهل (Easy)</option>
                    <option value="medium" selected>متوسط (Medium)</option>
                    <option value="hard">صعب (Hard)</option>
                </select>
            </div>

            <div class="form-group">
                <label>اختر الفريق / الشخصية:</label>
                <select id="character">
                    <option value="ct">القوات الخاصة (Special Forces)</option>
                    <option value="t">الفريق المعادي (Rebels)</option>
                </select>
            </div>

            <button class="btn" onclick="startGame()">بدء المعركة 🎮</button>
            <button class="btn btn-secondary" onclick="toggleSettings()">إعدادات المحاكي ⌨️</button>
        </div>
    </div>

    <!-- نافذة تعديل المفاتيح -->
    <div id="settings-modal">
        <h3>تعديل اختصارات اللابتوب</h3>
        <br>
        <div class="form-group">
            <label>زر القفز:</label>
            <input type="text" id="key-jump" value="Space" readonly onclick="bindKey('jump')">
        </div>
        <div class="form-group">
            <label>زر إطلاق النار:</label>
            <input type="text" id="key-shoot" value="Left Click" readonly>
        </div>
        <button class="btn" onclick="toggleSettings()">حفظ وإغلاق</button>
    </div>

    <!-- شاشة اللعبة -->
    <div id="game-container">
        <div id="crosshair"></div>
        <canvas id="gameCanvas"></canvas>

        <!-- طبقة مفاتيح المحاكي للابتوب -->
        <div class="emulator-overlay" id="emulatorUI">
            <div class="key-hint" style="bottom: 120px; left: 100px;">WASD (الحركة)</div>
            <div class="key-hint" style="bottom: 30px; right: 120px;" id="hint-jump">SPACE (القفز)</div>
            <div class="key-hint" style="top: 20px; left: 20px;">L-Click (إطلاق النار)</div>
            <div class="key-hint" style="top: 20px; right: 20px;">ESC (القائمة)</div>
        </div>

        <!-- أزرار التحكم باللمس للجوال -->
        <div class="touch-controls" id="touchUI">
            <div class="touch-btn" id="btn-move">🕹️</div>
            <div style="display: flex; gap: 15px;">
                <div class="touch-btn" id="btn-jump-touch">⬆️</div>
                <div class="touch-btn" id="btn-shoot-touch">💥</div>
            </div>
        </div>
    </div>

    <script>
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        let scene, camera, renderer, player;
        let bots = [];
        let keys = {};

        function startGame() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';

            if (isMobile) {
                document.getElementById('emulatorUI').style.display = 'none';
                document.getElementById('touchUI').style.display = 'flex';
            } else {
                document.getElementById('emulatorUI').style.display = 'block';
                document.getElementById('touchUI').style.display = 'none';
                document.body.requestPointerLock();
            }

            init3D();
        }

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
        }

        function bindKey(action) {
            alert("اضغط على أي زر لتخصيصه لـ " + action);
            window.addEventListener('keydown', function handler(e) {
                document.getElementById('key-' + action).value = e.code;
                document.getElementById('hint-' + action).innerText = e.code + " (" + action + ")";
                window.removeEventListener('keydown', handler);
            });
        }

        // إعداد عالم 3D بالكامل مع البوتات
        function init3D() {
            const container = document.getElementById('game-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 2;

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas') });
            renderer.setSize(window.innerWidth, window.innerHeight);

            // الإضاءة
            const light = new THREE.DirectionalLight(0xffffff, 1);
            light.position.set(10, 20, 10);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x404040));

            // الأرضية (الخريطة)
            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.MeshLambertMaterial({ color: 0x334155 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // إضافة الحوائط
            createWall(0, 2, -20, 40, 4, 2);
            createWall(-15, 2, 0, 2, 4, 30);

            // إضافة البوتات (Bots) حسب العدد المختار
            const botCount = parseInt(document.getElementById('botCount').value);
            for(let i=0; i<botCount; i++) {
                createBot((Math.random()-0.5)*40, 1, (Math.random()-0.5)*40);
            }

            // التحكم في حركة اللاعب
            window.addEventListener('keydown', e => keys[e.code] = true);
            window.addEventListener('keyup', e => keys[e.code] = false);

            document.addEventListener('mousemove', e => {
                if (document.pointerLockElement === document.body) {
                    camera.rotation.y -= e.movementX * 0.002;
                }
            });

            animate();
        }

        function createWall(x, y, z, w, h, d) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshLambertMaterial({ color: 0x475569 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            scene.add(mesh);
        }

        function createBot(x, y, z) {
            const geo = new THREE.BoxGeometry(1, 2, 1);
            const mat = new THREE.MeshLambertMaterial({ color: 0xef4444 });
            const bot = new THREE.Mesh(geo, mat);
            bot.position.set(x, y, z);
            scene.add(bot);
            bots.push(bot);
        }

        function animate() {
            requestAnimationFrame(animate);

            // حركيات الحركة WASD
            const speed = 0.15;
            if (keys['KeyW']) camera.translateZ(-speed);
            if (keys['KeyS']) camera.translateZ(speed);
            if (keys['KeyA']) camera.translateX(-speed);
            if (keys['KeyD']) camera.translateX(speed);

            // حركة البوتات البسيطة
            bots.forEach(bot => {
                bot.rotation.y += 0.01;
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if(camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
